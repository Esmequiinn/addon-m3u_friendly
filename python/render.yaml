services:
  - type: web
    name: addon-m3u-iptv
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn addon:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 7000
      - key: TMDB_API_KEY
        sync: false
      - key: M3U_URLS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
