services:
  - type: web
    name: m3u-iptv-addon
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: M3U_URLS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: SHOW_CHANNELS
        sync: false
